{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block header %}{{ title }}{% endblock %}
{% block content %}
<section class="card">
    <form method="post" class="stack">{% csrf_token %}
        {{ form.as_p }}
        <h3>Items</h3>
        {{ formset.management_form }}
        {% for f in formset %}
            <div class="formset-row">{{ f.as_p }}</div>
        {% endfor %}
        <button class="btn btn-primary" type="submit">Save menu</button>
    </form>
</section>
{% endblock %}
