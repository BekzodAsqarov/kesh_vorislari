{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in · Kesh Vorislari ERP</title>
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body class="auth-body">
    <main class="auth-card">
        <div class="brand">
            <span class="brand-mark">KV</span>
            <div>
                <strong>Kesh Vorislari ERP</strong>
                <small>Kindergarten management</small>
            </div>
        </div>
        <h1>Sign in</h1>
        {% if form.non_field_errors %}
            <div class="flash flash-error">{{ form.non_field_errors|striptags }}</div>
        {% endif %}
        <form method="post" novalidate>
            {% csrf_token %}
            <label>Email {{ form.username }}</label>
            <label>Password {{ form.password }}</label>
            <button class="btn btn-primary" type="submit">Sign in</button>
        </form>
        <p class="muted">Use your organisation email. Demo accounts are listed in the README.</p>
    </main>
</body>
</html>
